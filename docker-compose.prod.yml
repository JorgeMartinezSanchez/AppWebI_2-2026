services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo}
      POSTGRES_DB: ${POSTGRES_DB:-todoapp}
    ports:
      - "5432:5432"
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo} -d ${POSTGRES_DB:-todoapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    depends_on:            # <-- agregar
      db:
        condition: service_healthy
    volumes:
    - static_files:/app/app/static # not a source bind mount
    - ./migrations:/app/migrations
    networks:
    - backend
    - frontend
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql://todo:todo@db:5432/todoapp}
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn --config gunicorn.conf.py wsgi:app

  nginx:
    image: nginx:1.25-alpine
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - static_files:/app/app/static:ro
    depends_on:
    - web
    ports:
    - "${HTTP_PORT:-8080}:80" # the only public port
    networks:
    - frontend

volumes:
  postgres_data:
  static_files:

networks:
  frontend:
  backend:
    internal: true